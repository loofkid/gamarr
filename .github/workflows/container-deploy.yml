name: Publish Gamarr RKE2 deployment image

on:
  push:
    branches:
      - deploy/gamarr-7c3cbe8

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=7c3cbe88e073
          labels: org.opencontainers.image.source=https://github.com/loofkid/gamarr
          tags: ghcr.io/loofkid/gamarr:7c3cbe88e073
